<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' http://localhost:3000; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co http://localhost:3000;"
    />
  </head>
  <body>
    <div id="root">
      <div id="userLanding"></div>
      <div id="mainUI" class="app-shell" style="display: none">
        <nav id="appNav" class="app-nav" aria-label="Main">
          <div class="nav-items">
            <button class="nav-item active" data-view="home">
              <span class="nav-icon" aria-hidden="true">🏠</span>
              <span class="nav-label">Home</span>
            </button>
            <button class="nav-item" data-view="sessions">
              <span class="nav-icon" aria-hidden="true">🗂️</span>
              <span class="nav-label">Sessions</span>
            </button>
            <button class="nav-item" data-view="projects">
              <span class="nav-icon" aria-hidden="true">📁</span>
              <span class="nav-label">Projects</span>
            </button>
            <button class="nav-item" data-view="team" hidden>
              <span class="nav-icon" aria-hidden="true">👥</span>
              <span class="nav-label">Team</span>
            </button>
          </div>
          <div class="nav-footer">
            <button class="nav-item" data-view="settings">
              <span class="nav-icon" aria-hidden="true">⚙️</span>
              <span class="nav-label">Settings</span>
            </button>
            <div class="nav-timer" id="navTimer">
              <div class="nav-timer-readout">
                <span id="navTimerStatus" class="nav-timer-status">Not recording</span>
                <span id="navTimerClock" class="nav-timer-clock">0:00:00</span>
              </div>
              <div class="nav-timer-controls">
                <button id="recordBtn" title="Start/Stop recording (Ctrl+R)">
                  <img id="recordIcon" src="" alt="Record" />
                </button>
                <button id="pauseBtn" style="display: none" title="Pause/Resume (Ctrl+P)">
                  <img id="pauseIcon" src="" alt="Pause" />
                </button>
                <button
                  id="incognitoBtn"
                  title="Toggle Incognito Mode (Ctrl+Alt+Shift+I)"
                >
                  <span id="incognitoIcon">🕶️</span>
                </button>
                <button
                  id="notifBell"
                  title="Notifications"
                  aria-label="Notifications"
                >
                  🔔
                </button>
              </div>
            </div>
          </div>
        </nav>

        <main class="app-main">
          <section id="view-home" class="view">
            <div class="container">
              <div id="dashboardContent"></div>
              <details id="appActivity" class="app-activity">
                <summary>App activity today</summary>
                <table id="logTable">
                  <thead>
                    <tr>
                      <th></th>
                      <th>Application</th>
                      <th></th>
                      <th>Language</th>
                      <th>Time Spent Today</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </details>
            </div>
          </section>

          <section id="view-sessions" class="view" hidden>
            <div class="subnav" role="tablist" aria-label="Sessions views">
              <button class="subnav-btn active" data-sub="list" role="tab">List</button>
              <button class="subnav-btn" data-sub="calendar" role="tab">Calendar</button>
              <button class="subnav-btn" data-sub="insights" role="tab">Insights</button>
            </div>
            <div class="subview" data-sub="list">
              <div class="container"><div id="summaryContent"></div></div>
            </div>
            <div class="subview" data-sub="calendar" hidden>
              <div class="container"><div id="calendarContent"></div></div>
            </div>
            <div class="subview" data-sub="insights" hidden>
              <div class="container"><div id="insightsContent"></div></div>
            </div>
          </section>

          <section id="view-projects" class="view" hidden>
            <div class="container"><div id="projectsContent"></div></div>
          </section>

          <section id="view-team" class="view" hidden>
            <div class="subnav" role="tablist" aria-label="Team views">
              <button class="subnav-btn active" data-sub="organization" role="tab">Organization</button>
              <button class="subnav-btn" data-sub="analytics" role="tab" hidden>Analytics</button>
            </div>
            <div class="subview" data-sub="organization">
              <div class="container"><div id="organizationContent"></div></div>
            </div>
            <div class="subview" data-sub="analytics" hidden>
              <div class="container"><div id="teamAnalyticsContent"></div></div>
            </div>
          </section>

          <section id="view-settings" class="view" hidden>
            <div class="container">
              <h1>Settings</h1>
              <div id="settingsContent"></div>
            </div>
          </section>
        </main>

        <div
          id="incognitoBanner"
          class="incognito-banner"
          style="display: none"
        >
          <span>🔒 Incognito — Activity Not Tracked</span>
        </div>
        <div
          id="notificationSidebar"
          class="notification-sidebar"
          style="display: none"
        ></div>
      </div>
    </div>
  </body>
</html>
