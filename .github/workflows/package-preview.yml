name: Package Preview

on:
  workflow_dispatch:

jobs:
  make:
    name: Make (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-artifacts
          - os: windows-latest
            artifact_name: windows-artifacts
          - os: macos-latest
            artifact_name: macos-artifacts

    env:
      UPDATER_ENABLED: true
      UPDATER_ALLOW_DEV: true
      UPDATER_AUTO_CHECK: false
      UPDATER_AUTO_DOWNLOAD: false
      UPDATER_GITHUB_OWNER: ${{ github.repository_owner }}
      UPDATER_GITHUB_REPO: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create distributables
        run: npm run make

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            out/**
          if-no-files-found: warn
