name: One-Button Release

# Bumps the version, tags it, builds installers on each OS and attaches them
# to a GitHub release. Installed Windows apps update themselves from the latest
# *published* release (via update.electronjs.org), so a release reaches users
# only once it is published, not while it is a draft.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (patch/minor/major or exact semver). Leave empty to use package.json version."
        required: false
      release_notes:
        description: "Optional release notes override. If empty, autogenerated from commits since last tag."
        required: false
      publish:
        description: "Publish the release (true) or keep as draft (false). Default false."
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  prepare:
    name: Version, tag and draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git for tagging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.1

      - name: Get last tag
        id: vars
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            echo "last_tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          else
            echo "last_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Bump version and create tag (if `version` input provided)
        if: ${{ inputs.version != '' }}
        run: |
          set -e
          npm version "${{ inputs.version }}" -m "chore(release): %s [skip ci]"
          git push origin --follow-tags

      - name: Ensure tag exists for current package version
        if: ${{ inputs.version == '' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
          else
            git tag -a "v$VERSION" -m "release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Read release version
        id: release_version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Release notes (autogenerated unless provided)
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s
' "$NOTES" > notes.md
          elif [ -z "${{ steps.vars.outputs.last_tag }}" ]; then
            git log --pretty=format:'- %s (%h)' --no-merges > notes.md
          else
            git log "${{ steps.vars.outputs.last_tag }}"..HEAD --pretty=format:'- %s (%h)' --no-merges > notes.md
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --draft --title "Release $TAG" --notes-file notes.md
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create distributables
        run: npm run make
        env:
          # Baked into the bundle at build time (see webpack.plugins.ts).
          # Empty secret = Sentry stays disabled in the build.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # Windows: the Squirrel files are what auto-update needs
      # (RELEASES + .nupkg) plus the Setup.exe for new installs.
      - name: Upload Windows installer and update files
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" out/make/squirrel.windows/x64/* --clobber

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" $(find out/make -name '*.deb' -o -name '*.rpm') --clobber

  publish:
    name: Publish release
    needs: [prepare, build]
    if: ${{ inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --repo "${{ github.repository }}"
