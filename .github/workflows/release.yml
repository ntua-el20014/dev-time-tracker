name: One-Button Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (patch/minor/major or exact semver). Leave empty to use package.json version."
        required: false
      release_notes:
        description: "Optional release notes override. If empty, autogenerated from commits since last tag."
        required: false
      publish:
        description: "Publish the release (true) or keep as draft (false). Default false."
        required: false
        default: "false"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git for tagging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get current package version and last tag
        id: vars
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          else
            echo "last_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Bump version and create tag (if `version` input provided)
        if: ${{ inputs.version != '' }}
        run: |
          set -e
          V="${{ inputs.version }}"
          npm version "$V" -m "chore(release): %s [skip ci]"
          git push origin --follow-tags

      - name: Ensure tag exists for current package version
        if: ${{ inputs.version == '' }}
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
          else
            git tag -a "v$VERSION" -m "release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Re-read release version
        id: release_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes (autogenerated if not provided)
        id: notes
        run: |
          LAST_TAG="${{ steps.vars.outputs.last_tag }}"
          if [ -z "$LAST_TAG" ]; then
            NOTES=$(git log --pretty=format:'- %s (%h)' --no-merges)
          else
            NOTES=$(git log "$LAST_TAG"..HEAD --pretty=format:'- %s (%h)' --no-merges)
          fi
          if [ -z "${{ inputs.release_notes }}" ]; then
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "${{ inputs.release_notes }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create distributables
        run: npm run make

      - name: Create release (draft by default) and upload artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.release_version.outputs.version }}
          name: Release v${{ steps.release_version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          draft: ${{ inputs.publish != 'true' }}
          artifacts: out/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
